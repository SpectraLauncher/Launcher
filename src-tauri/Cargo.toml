[package]
name = "app"
version = "0.7.8"
description = "A modern launcher for Minecraft that allows you to easily manage multiple installations of Minecraft at once"
authors = ["MakotoPD"]
license = "MIT"
repository = "https://github.com/MakotoPD/Spectra-Launcher"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spectra_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"

# Tauri plugins (must match JS-side @tauri-apps/plugin-* versions)
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"

# Background auto-update (Discord-style: silent download + install + relaunch)
tauri-plugin-process = "2"

# `spectra://share/<code>` links from the website open the launcher directly
tauri-plugin-deep-link = "2"

# Minecraft engine: install/launch, Microsoft auth, Fabric/Quilt/Forge/NeoForge,
# automatic Java provisioning. https://github.com/BatuhanAksoyy/lyceris
lyceris = "1.1.3"

# Async runtime + HTTP client (reqwest features mirror lyceris to avoid OpenSSL)
tokio = { version = "1", features = ["full"] }
# `stream` lets a share pack be uploaded straight off disk — a gigabyte of
# modpack has no business being held in memory.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

# Utilities
anyhow = "1"
thiserror = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# Total system memory (for the RAM allocation slider)
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Discord Rich Presence (privacy-gated)
discord-rich-presence = "0.2"

# Reading instance content: zip packs, gzipped NBT world saves (level.dat)
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
fastnbt = "2"
# Parsing Forge/NeoForge mods.toml metadata from local jars
toml = "0.8"
# sha1 of local jars, to match them against Modrinth by file hash
sha1 = "0.10"

# Background auto-update — desktop only
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
# Windows/Linux deliver deep links by launching a second process; single-instance
# forwards the URL to the running launcher instead (must be registered first).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# libc — used for getpgid() to kill the whole JVM process group on Unix
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

# Renames the `spectra://` handler shown in browser prompts (the deep-link plugin
# registers it under the raw bundle identifier). Already in the tree via that plugin.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"
# DPAPI, to encrypt the token files at rest. Windows has no equivalent of the
# 0600 mode the Unix build relies on, so without this the Microsoft refresh
# token and the Spectra session sit in plaintext for every process on the
# account to read. Version matches the copy Tauri already pulls in.
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
