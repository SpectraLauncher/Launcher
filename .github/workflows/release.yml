name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VERSION"

      - name: Check whether tag already exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG is new — proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          VERSION_NUM="${{ steps.version.outputs.version }}"

          CHANGELOG=$(awk "/^## Changes \(${VERSION}\)/{flag=1; next} /^## Changes \(v[0-9]/{if(flag) exit} flag" release.txt)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No specific changes documented for this version."
          fi

          {
            echo "## 📥 Downloads"
            echo ""
            echo "| Platform | Architecture | Download |"
            echo "|----------|-------------|----------|"
            echo "| 🪟 Windows | x64 | [Spectra.Launcher_${VERSION_NUM}_x64-setup.exe](https://github.com/MakotoPD/Spectra-Launcher/releases/download/${VERSION}/Spectra.Launcher_${VERSION_NUM}_x64-setup.exe) |"
            echo "| 🍎 macOS | Apple Silicon (M1+) | [Spectra.Launcher_${VERSION_NUM}_aarch64.dmg](https://github.com/MakotoPD/Spectra-Launcher/releases/download/${VERSION}/Spectra.Launcher_${VERSION_NUM}_aarch64.dmg) |"
            echo "| 🍎 macOS | Intel (x64) | [Spectra.Launcher_${VERSION_NUM}_x64.dmg](https://github.com/MakotoPD/Spectra-Launcher/releases/download/${VERSION}/Spectra.Launcher_${VERSION_NUM}_x64.dmg) |"
            echo "| 🐧 Linux | x64 (AppImage) | [Spectra.Launcher_${VERSION_NUM}_amd64.AppImage](https://github.com/MakotoPD/Spectra-Launcher/releases/download/${VERSION}/Spectra.Launcher_${VERSION_NUM}_amd64.AppImage) |"
            echo "| 🐧 Linux | x64 (deb) | [Spectra.Launcher_${VERSION_NUM}_amd64.deb](https://github.com/MakotoPD/Spectra-Launcher/releases/download/${VERSION}/Spectra.Launcher_${VERSION_NUM}_amd64.deb) |"
            echo ""
            echo "---"
            echo ""
            echo "## 📝 What's Changed"
            echo ""
            echo "$CHANGELOG"
          } > release_body.md

          {
            echo "body<<RELEASE_EOF"
            cat release_body.md
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    environment: BUILD
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 squashfs-tools file

      - name: Let the AppImage use the system libwayland (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -euo pipefail
          TAURI_CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          URL='https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage'
          SHA='c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
          mkdir -p "$TAURI_CACHE"
          TMP="$(mktemp)"
          curl -fsSL "$URL" -o "$TMP"
          echo "$SHA  $TMP" | sha256sum --check --quiet
          install -m 755 "$TMP" "$TAURI_CACHE/linuxdeploy-x86_64.AppImage"
          rm -f "$TMP"
          echo 'LINUXDEPLOY_EXCLUDED_LIBRARIES=libwayland-client.so*' >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          shell: bash
          command: |
            rustup toolchain install stable --profile minimal --no-self-update
            rustup default stable
            target="${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}"
            if [ -n "$target" ]; then rustup target add "$target"; fi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: 'Spectra Launcher v${{ needs.prepare.outputs.version }}'
          releaseBody: ${{ needs.prepare.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, release]
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft, once every platform has uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.prepare.outputs.version }}"             --draft=false --latest --repo "$GITHUB_REPOSITORY"
